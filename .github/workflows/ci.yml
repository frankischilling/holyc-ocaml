name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: OCaml ${{ matrix.ocaml-compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - 5.1.x
          - 5.3.x
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-dev-setup

      - name: Check formatting
        run: opam exec -- dune build @fmt

      - name: Check generated source
        run: opam exec -- dune build @generated-check

      - name: Verify the pinned reference
        shell: pwsh
        run: ./tools/verify-reference.ps1

      - name: Build
        run: opam exec -- dune build @all

      - name: Run tests
        run: opam exec -- dune runtest --no-buffer

      - name: Build package artifacts
        run: opam exec -- dune build @install
