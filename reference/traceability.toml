  "Kernel/BlkDev/DskStrA.HC:FileNameAbs",
  "Kernel/BlkDev/DskStrA.HC:ExtDft",
  "Doc/PreProcessor.DD",
  "Doc/Lex.DD",
  "Doc/Directives.DD"
]
